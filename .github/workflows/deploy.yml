name: deploy

# Production deploy on push to main. A commit must already be on origin/staging unless
# its pull request carries the `hotfix` label (PL-76a).
on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.flag.outputs.enabled }}
    steps:
      - id: flag
        env:
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
        run: echo "enabled=$HAS_VERCEL" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      APP_ENV: production
      DATABASE_DRIVER: neon-ws
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: refuse a commit that is not on staging (unless hotfix)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git fetch origin staging
          if git merge-base --is-ancestor "$SHA" origin/staging; then
            echo "commit is on staging"
            exit 0
          fi
          labels=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].labels[].name' || true)
          if printf '%s\n' "$labels" | grep -qx hotfix; then
            echo "hotfix: deploying a commit that is not on staging"
            exit 0
          fi
          echo "::error::commit $SHA is not on origin/staging and its pull request has no hotfix label"
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:indexes
      - run: pnpm db:migrate
      - run: pnpm db:seed --profile defaults
      - run: npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
      - run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
